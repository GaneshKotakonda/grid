services:
  - type: web
    name: gridresilience-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install --no-cache-dir 'torch>=2.2,<3' --index-url https://download.pytorch.org/whl/cpu
      && pip install --no-cache-dir -r requirements-render.txt
    startCommand: python -m uvicorn src.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: MPLBACKEND
        value: Agg
